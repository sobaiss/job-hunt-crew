packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  unrs-resolver: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  # msw's postinstall only copies the browser mockServiceWorker.js into a
  # public dir; tests here use msw/node (Vitest) and page.route (Playwright),
  # so the browser worker is never needed.
  msw: false
  # Pulled in transitively via next-intl. Neither is needed here: next bundles
  # its own swc, and nothing watches files outside `next dev` (which uses its
  # own watcher). Skip their native postinstall builds.
  '@parcel/watcher': false
  '@swc/core': false
