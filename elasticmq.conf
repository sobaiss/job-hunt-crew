include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  analysis-intake {
    # Long: the local worker (WORKER_ANALYSIS_MODE=local) runs the whole
    # AnalysisWorkflow — up to ~5 LLM calls (CV conversion, offer extraction,
    # 2 crew agents) — in-process before deleting the message. A 30s timeout
    # would redeliver mid-run and double-process it.
    defaultVisibilityTimeout = 600 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
  cv-conversion {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
  ingestion-intake {
    # Long, same reason as analysis-intake: the local worker runs the whole
    # discover/scrape/extract pipeline for the IngestionJob — a multi-page
    # listing fetch plus per-offer LLM extraction, then the analysis fan-out —
    # in-process before deleting the message. A 30s timeout would redeliver
    # mid-run and double-process the batch.
    defaultVisibilityTimeout = 600 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
  scout-intake {
    # Short: dispatch_scout_run only writes a few rows and enqueues one
    # ingestion-intake message per targeted site — no scraping or LLM work
    # happens here, that is deferred to the ingestion-intake pipeline.
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}
