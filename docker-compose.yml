services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_hunt_crew
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev, standing in for AWS S3
  # (see PRD Section 4). Bucket layout/keys match the real S3 target 1:1.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-createbucket:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/job-hunt-crew &&
      exit 0
      "

  # SQS-compatible queue for local dev, standing in for AWS SQS (see PRD
  # Section 4/10). ElasticMQ is a single-purpose emulator, same rationale as
  # MinIO above for S3.
  elasticmq:
    image: softwaremill/elasticmq:1.6.7
    restart: unless-stopped
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

  # Step Functions-compatible state machine engine for local dev, standing
  # in for AWS Step Functions (see PRD Section 4/10). LAMBDA_ENDPOINT points
  # Task states at services/analysis's lambda_shim.py, the local stand-in
  # for the 3 real AnalysisWorkflow Lambda functions (M5-T2) — run it via
  # `uv run --package analysis python -m analysis.lambda_shim` before
  # starting an execution.
  stepfunctions-local:
    image: amazon/aws-stepfunctions-local:2.0.0
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      LAMBDA_ENDPOINT: http://host.docker.internal:9099
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Applies pending Prisma migrations to Postgres, then exits. Runs on every
  # `docker compose up` (idempotent — no-ops once the schema is current), so
  # a fresh Postgres volume never starts `api` against a missing schema.
  # `api` waits on this completing (see its `depends_on` below).
  # migrate:
  #   build:
  #     context: .
  #     dockerfile: packages/prisma/Dockerfile
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/job_hunt_crew
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # services/api (FastAPI): sole owner of Postgres/S3/SQS per PRD Section 7,
  # called only by apps/web's BFF proxy (M7). Built from the repo root so uv
  # can resolve the workspace (see services/api/Dockerfile).
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/job_hunt_crew
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-api-secret}
      # Enables browser access to /docs, /redoc, /openapi.json without the
      # internal secret header — see enforce_internal_api_secret in main.py.
      ENVIRONMENT: development
      # boto3's generate_presigned_url performs no network I/O — it only signs
      # the URL with this value baked in as the host. Must be the *browser*-
      # reachable MinIO address (matching apps/web's pre-M7 S3_ENDPOINT), not
      # the docker-network hostname `minio`, or the browser's PUT to the
      # presigned URL can't resolve it.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: job-hunt-crew
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      # ElasticMQ, same rationale as S3_ENDPOINT above: the container reaches
      # it via the docker-network hostname (unlike S3's presigned URLs, SQS
      # calls are made directly by this service, never by the browser).
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_REGION: us-east-1
      SQS_ANALYSIS_INTAKE_QUEUE_URL: http://elasticmq:9324/000000000000/analysis-intake
      SQS_CV_CONVERSION_QUEUE_URL: http://elasticmq:9324/000000000000/cv-conversion
      SQS_INGESTION_INTAKE_QUEUE_URL: http://elasticmq:9324/000000000000/ingestion-intake
      SQS_SCOUT_INTAKE_QUEUE_URL: http://elasticmq:9324/000000000000/scout-intake
      SQS_GENERATION_INTAKE_QUEUE_URL: http://elasticmq:9324/000000000000/generation-intake
      SQS_ACCESS_KEY_ID: x
      SQS_SECRET_ACCESS_KEY: x
    depends_on:
      postgres:
        condition: service_healthy
      # migrate:
      #   condition: service_completed_successfully
      minio:
        condition: service_healthy
      elasticmq:
        condition: service_started

  # Local stand-in for the AWS SQS -> Lambda event-source mappings that drain
  # the pipeline's queues in production (out of scope per PRD Section 4/15, so
  # nothing drains them locally otherwise). Polls ElasticMQ and runs the real
  # handlers — see services/ingestion/src/ingestion/local_worker.py.
  #
  # Drains all five pipeline queues, so "Convert to Markdown", "Analyse one
  # offer", "Analyse several offers", a Scout run, and "Generate documents"
  # all work straight after `docker compose up`:
  #   - cv-conversion    -> analysis.cv_conversion.handle_cv_conversion
  #   - ingestion-intake -> ingestion.intake_handler.handle_ingestion_intake
  #     (the ADR 0002 fan-out worker: runs discover/scrape/extract for the
  #     IngestionJob, then creates one Analysis per READY JobOffer and enqueues
  #     it on analysis-intake)
  #   - analysis-intake  -> analysis.local_pipeline (WORKER_ANALYSIS_MODE=local):
  #     the whole AnalysisWorkflow in-process, no host-only `lambda_shim` /
  #     Step Functions execution needed, just an LLM the crew can reach
  #     (LLM_PROVIDER below, ollama by default).
  #   - scout-intake     -> scout.intake_handler.handle_scout_intake, fed by a
  #     manual "Run now" (services/api) and, since issue #57, this worker's own
  #     scout-schedule tick — its local stand-in for the production EventBridge
  #     Scheduler rule that fires at SCOUT_SCHEDULE_HOUR_UTC (default 6 UTC)
  #     and enqueues every due, active Scout with no user action. See
  #     services/scout/src/scout/schedule.py for both.
  #   - generation-intake -> analysis.generation_pipeline.handle_generation_intake_local
  #     (issue #58): fed by "Generate documents" on a find (services/api),
  #     runs the CoverLetterWriterAgent / CVTailoringAgent in-process, the
  #     same simplification analysis-intake's local mode uses.
  # Set WORKER_ANALYSIS_MODE=stepfunctions + run `make worker` on the host to
  # exercise the real Step Functions state machine instead.
  worker:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/job_hunt_crew
      WORKER_QUEUES: cv-conversion,ingestion-intake,analysis-intake,scout-intake,generation-intake
      # `local` (in-process AnalysisWorkflow) vs `stepfunctions` (real Step
      # Functions Local execution — needs the host lambda_shim + SFN_* env).
      WORKER_ANALYSIS_MODE: ${WORKER_ANALYSIS_MODE:-local}
      # Daily UTC hour every active Scout is due (issue #57); how often this
      # worker checks for due Scouts is separate (SCOUT_SCHEDULE_TICK_SECONDS,
      # default 60s — fine locally, irrelevant in production's EventBridge rule).
      SCOUT_SCHEDULE_HOUR_UTC: ${SCOUT_SCHEDULE_HOUR_UTC:-6}
      # S3 is read directly here (no presigning), so unlike `api` this uses the
      # docker-network hostname, not localhost.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: job-hunt-crew
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_REGION: us-east-1
      SQS_CV_CONVERSION_QUEUE_URL: http://elasticmq:9324/000000000000/cv-conversion
      SQS_ANALYSIS_INTAKE_QUEUE_URL: http://elasticmq:9324/000000000000/analysis-intake
      SQS_INGESTION_INTAKE_QUEUE_URL: http://elasticmq:9324/000000000000/ingestion-intake
      SQS_SCOUT_INTAKE_QUEUE_URL: http://elasticmq:9324/000000000000/scout-intake
      SQS_GENERATION_INTAKE_QUEUE_URL: http://elasticmq:9324/000000000000/generation-intake
      SQS_ACCESS_KEY_ID: x
      SQS_SECRET_ACCESS_KEY: x
      # The crew run (analysis-intake) and any PDF/DOCX Conversion call an LLM
      # through this provider; the MD/TXT Conversion path needs none. Passed
      # through from the host env, defaulting to a local Ollama (no API key).
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Only for LLM_PROVIDER=ollama (dev-local only, not a supported production
      # backend). From this container Ollama on the host is reachable at
      # http://host.docker.internal:11434/v1 — set that in your host env.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      # SITE_SEARCH ("Analyse several offers") against France Travail — the one
      # seeded OFFICIAL_API site — calls the France Travail API, which needs an
      # OAuth client-credentials pair. Passed through from the host env (.env);
      # the HTML_SCRAPE sites and "Analyse one offer" on a non-FT URL don't use
      # them. FRANCE_TRAVAIL_SCOPE is an optional override — left unset here so
      # france_travail.py's DEFAULT_SCOPE applies (passing `${VAR:-}` would
      # inject an empty string, which is *not* the same as unset).
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID:-}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      # migrate:
      #   condition: service_completed_successfully
      minio:
        condition: service_healthy
      elasticmq:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
