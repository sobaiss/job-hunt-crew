services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_hunt_crew
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev, standing in for AWS S3
  # (see PRD Section 4). Bucket layout/keys match the real S3 target 1:1.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-createbucket:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/job-hunt-crew &&
      exit 0
      "

  # SQS-compatible queue for local dev, standing in for AWS SQS (see PRD
  # Section 4/10). ElasticMQ is a single-purpose emulator, same rationale as
  # MinIO above for S3.
  elasticmq:
    image: softwaremill/elasticmq:1.6.7
    restart: unless-stopped
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

  # Step Functions-compatible state machine engine for local dev, standing
  # in for AWS Step Functions (see PRD Section 4/10). LAMBDA_ENDPOINT points
  # Task states at services/analysis's lambda_shim.py, the local stand-in
  # for the 3 real AnalysisWorkflow Lambda functions (M5-T2) — run it via
  # `uv run --package analysis python -m analysis.lambda_shim` before
  # starting an execution.
  stepfunctions-local:
    image: amazon/aws-stepfunctions-local:2.0.0
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      LAMBDA_ENDPOINT: http://host.docker.internal:9099
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  minio-data:
