[project]
name = "py-db"
version = "0.0.0"
description = "SQLAlchemy models regenerated from the Prisma-owned Postgres schema via sqlacodegen. Do not hand-edit generated models; re-run `scripts/generate.sh` after every Prisma migration."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_db"]

[dependency-groups]
dev = [
    "sqlacodegen>=3.0",
    "psycopg2-binary>=2.9",
]
