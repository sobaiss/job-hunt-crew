name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  web-tests:
    name: Web Tests (Vitest + Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm --filter web test

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  python-tests:
    name: Python Tests (services/api, ingestion, analysis)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_hunt_crew?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Postgres/MinIO/ElasticMQ
        run: docker compose up -d postgres minio elasticmq --wait

      - name: Create MinIO bucket
        run: docker compose up minio-createbucket

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        run: pnpm --filter @job-hunt-crew/prisma exec prisma migrate deploy

      - name: Seed SiteConfig rows
        run: pnpm --filter @job-hunt-crew/prisma exec prisma db seed

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync

      - name: Run services/api tests
        run: uv run --package api pytest services/api/tests -q

      - name: Run services/ingestion tests
        run: uv run --package ingestion pytest services/ingestion/tests -q

      - name: Run services/analysis tests
        run: uv run --package analysis pytest services/analysis/tests -q
