[project]
name = "analysis"
version = "0.0.0"
description = "AI analysis pipeline: CrewAI crew/agents/tasks, Fargate task entrypoint."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
