[project]
name = "analysis"
version = "0.0.0"
description = "AI analysis pipeline: CrewAI crew/agents/tasks, Fargate task entrypoint."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.0",
    "boto3>=1.34",
    "py-db",
]

[tool.uv.sources]
py-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
