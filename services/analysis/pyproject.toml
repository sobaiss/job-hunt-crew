[project]
name = "analysis"
version = "0.0.0"
description = "AI analysis pipeline: CrewAI crew/agents/tasks, Fargate task entrypoint."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.0",
    "boto3>=1.34",
    "py-db",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "mammoth>=1.6",
    "pdfplumber>=0.11.10",
    # Used by the LLM extraction tier to pull a page's *content region* out of
    # its markup; a regex can't find `<main>` reliably across real pages.
    "beautifulsoup4>=4.12",
]

[tool.uv.sources]
py-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
