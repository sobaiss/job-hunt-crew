[project]
name = "scout"
version = "0.0.0"
description = "Scout scheduling + run orchestration: fans a ScoutRun out to the ingestion pipeline (issue #54)."
requires-python = ">=3.11"
dependencies = [
    "py-db",
    "boto3>=1.34",
]

[tool.uv.sources]
py-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
